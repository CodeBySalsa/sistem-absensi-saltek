[variables]
PHP_VERSION = "8.4"
NODE_VERSION = "20" # Tambahkan ini jika aplikasi Anda pakai Vite/Tailwind

[phases.setup]
nixPackages = ["php84", "php84Packages.composer", "nodejs_20"]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
# Gunakan built-in web server PHP untuk dev, tapi untuk production
# sebaiknya gunakan 'php -S 0.0.0.0:$PORT -t public'
cmd = "php -S 0.0.0.0:$PORT -t public"