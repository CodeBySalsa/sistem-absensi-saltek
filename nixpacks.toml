[variables]
PHP_VERSION = "8.4"
NODE_VERSION = "20"

[phases.setup]
nixPackages = ["php84", "php84Packages.composer", "nodejs_20"]

[phases.build]
cmds = [
    "npm install",
    "npm run build",
    "composer install --no-dev --optimize-autoloader"
]

[phases.start]
cmds = ["php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"]